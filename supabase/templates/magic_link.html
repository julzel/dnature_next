<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu código de acceso</title>
  </head>
  <body style="background:#f7f7f3;color:#173f43;font-family:Arial,sans-serif;margin:0;padding:24px">
    <div style="background:#ffffff;border-radius:18px;margin:0 auto;max-width:520px;padding:32px">
      <p style="color:#e56f2d;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Mi DNAture</p>
      <h1 style="font-size:26px;margin:8px 0 14px">Tu código para ingresar</h1>
      <p style="line-height:1.6">Usá este código de un solo uso para continuar:</p>
      <p style="background:#eef8fa;border-radius:14px;color:#186b77;font-size:32px;font-weight:700;letter-spacing:.18em;padding:18px;text-align:center">{{ .Token }}</p>
      <p style="font-size:14px;line-height:1.6">El código vence en 15 minutos. Si no solicitaste este acceso, podés ignorar el mensaje.</p>
      <p style="color:#687678;font-size:12px;line-height:1.5;margin-top:28px">Nunca compartás este código. DNAture no te lo pedirá por llamada, chat ni WhatsApp.</p>
    </div>
  </body>
</html>
